<!doctype html>

<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>코딩 타자연습 (한컴 스타일) — single file</title>
<style>
:root{--bg:#0f1724;--panel:#0b1220;--accent:#7c3aed;--muted:#94a3b8;--ok:#16a34a;--err:#ef4444}
*{box-sizing:border-box;font-family:Inter, Roboto, Noto Sans KR, 'Segoe UI', system-ui}
html,body{height:100%;margin:0;background:linear-gradient(180deg,#07142a 0%, #081226 100%);color:#e6eef8}
.container{max-width:1100px;margin:28px auto;padding:20px}
.header{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.logo{background:var(--panel);padding:10px 14px;border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.6)}
.controls{display:flex;gap:8px;align-items:center}
.select, .btn, .file{background:var(--panel);border:1px solid rgba(255,255,255,.04);padding:8px 10px;border-radius:8px;color:inherit}
.btn{cursor:pointer}
.row{display:flex;gap:12px}
.column{flex:1}
.panel{background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.03));padding:14px;border-radius:12px;box-shadow:0 8px 24px rgba(2,6,23,.6);border:1px solid rgba(255,255,255,0.03)}
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.codeArea{height:360px;overflow:auto;padding:14px;background:#01040a;border-radius:8px;font-family:'Source Code Pro', ui-monospace, SFMono-Regular, Menlo, Monaco, 'Roboto Mono', monospace;font-size:14px;line-height:1.6;color:#dbeafe}
.codeLine{white-space:pre-wrap}
.char{opacity:.9}
.char.correct{color:var(--muted)}
.char.ok{color:var(--ok)}
.char.err{color:var(--err);background:rgba(239,68,68,0.06);border-radius:3px}
.cursor{display:inline-block;width:2px;background:var(--accent);height:1.2em;vertical-align:bottom;animation:blink 1s steps(2,end) infinite}
@keyframes blink{50%{opacity:0}}
.stats{display:flex;gap:12px;align-items:center}
.stat{background:rgba(255,255,255,0.02);padding:8px 10px;border-radius:8px;font-size:13px}
.footer{margin-top:12px;color:var(--muted);font-size:13px}
.inputCapture{position:fixed;left:-9999px;opacity:0}
.small{font-size:12px;color:var(--muted)}
.keyword{color:#60a5fa}
.string{color:#fbbf24}
.comment{color:#94a3b8}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="logo"><strong>코딩 타자연습</strong> — 한컴 스타일 (single HTML)</div>
    <div class="controls">
      <select id="sampleSelect" class="select">
        <option value="sample_js">JavaScript: forEach / async</option>
        <option value="sample_py">Python: generator / listcomp</option>
        <option value="sample_cpp">C++: class + iostream</option>
        <option value="custom">사용자 지문 붙여넣기 / 업로드</option>
      </select>
      <button id="startBtn" class="btn">시작</button>
      <button id="resetBtn" class="btn">초기화</button>
      <input id="fileInput" class="file" type="file" accept=".txt,.py,.js,.cpp,.c,.java" />
    </div>
  </div>  <div class="row">
    <div class="column panel">
      <div class="toolbar">
        <div class="small">지문</div>
        <div style="flex:1"></div>
        <div class="small">언어: <span id="langLabel">JS</span></div>
      </div>
      <div id="codeView" class="codeArea" tabindex="0"></div>
      <textarea id="hiddenInput" class="inputCapture" autofocus></textarea>
    </div>
    <div style="width:300px" class="panel">
      <div class="stats">
        <div class="stat">시간: <span id="time">0</span>s</div>
        <div class="stat">타수(CPM): <span id="cpm">0</span></div>
        <div class="stat">정확도: <span id="acc">100%</span></div>
      </div>
      <div style="margin-top:12px">
        <div class="small">오타 상위</div>
        <ul id="mistakes" class="small"></ul>
      </div>
      <div style="margin-top:12px">
        <div class="small">설정</div>
        <label class="small"><input type="checkbox" id="showHighlight" checked/> 문법 하이라이트</label><br>
        <label class="small"><input type="checkbox" id="countTabs"/> 탭을 4칸으로 계산</label>
      </div>
      <div style="margin-top:12px">
        <div class="small">사용자 지문</div>
        <textarea id="customText" rows="6" style="width:100%;margin-top:6px;background:#020617;border-radius:6px;padding:8px;color:#dbeafe"></textarea>
      </div>
    </div>
  </div>  <div class="footer">사용법: 지문 선택 → 시작 버튼 → 포커스가 자동으로 숨은 입력으로 이동합니다. 탭/스페이스/개행도 연습됩니다. 파일 업로드는 .txt/.py/.js 등 지원.</div>
</div><script>
// --- sample texts ---
const SAMPLES = {
  sample_js: `// async fetch example\nasync function fetchAll(urls) {\n  const results = []\n  for (const url of urls) {\n    try {\n      const res = await fetch(url);\n      const txt = await res.text();\n      results.push(txt);\n    } catch (e) {\n      console.error('fetch failed', e);\n      results.push(null);\n    }\n  }\n  return results;\n}\n\n[1,2,3].forEach(n => console.log(n));\n`,
  sample_py: `# generator & list comprehension\ndef primes(n):\n    D = {}\n    q = 2\n    while q <= n:\n        if q not in D:\n            yield q\n            D[q*q] = [q]\n        else:\n            for p in D[q]:\n                D.setdefault(p+q,[]).append(p)\n            del D[q]\n        q += 1\n\nprint([p for p in primes(30)])\n`,
  sample_cpp: `#include <iostream>\nusing namespace std;\nclass Point {\npublic:\n    int x, y;\n    Point(int x_, int y_): x(x_), y(y_) {}\n    void print(){ cout << "(" << x << ", " << y << ")\n"; }\n};\nint main(){\n    Point p(3,4);\n    p.print();\n    return 0;\n}\n`
};

// --- state ---
let target = '';
let chars = []; // array of {ch, span, status}
let pos = 0;
let running = false;
let startTime = null;
let timerInterval = null;
let mistakes = {};
let lang = 'JS';

const codeView = document.getElementById('codeView');
const hiddenInput = document.getElementById('hiddenInput');
const startBtn = document.getElementById('startBtn');
const resetBtn = document.getElementById('resetBtn');
const sampleSelect = document.getElementById('sampleSelect');
const customText = document.getElementById('customText');
const fileInput = document.getElementById('fileInput');
const timeEl = document.getElementById('time');
const cpmEl = document.getElementById('cpm');
const accEl = document.getElementById('acc');
const mistakesEl = document.getElementById('mistakes');
const langLabel = document.getElementById('langLabel');
const showHighlight = document.getElementById('showHighlight');
const countTabs = document.getElementById('countTabs');

function loadSample(key){
  if(key === 'custom'){
    target = customText.value || '// 사용자 지문을 붙여넣고 시작하세요.\n';
  } else {
    target = SAMPLES[key] || '';
  }
  lang = key.includes('js') ? 'JS' : key.includes('py') ? 'PY' : key.includes('cpp') ? 'CPP' : 'TXT';
  langLabel.textContent = lang;
  renderTarget();
}

function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function simpleHighlight(text){
  if(!showHighlight.checked) return escapeHtml(text);
  if(lang === 'JS'){
    // tiny regex-based highlight (not perfect)
    return escapeHtml(text)
      .replace(/(\/\/.*?$)/gm, '<span class="comment">$1</span>')
      .replace(/('[^']*'|\"[^\"]*\")/g, '<span class="string">$1</span>')
      .replace(/\b(const|let|var|async|await|function|for|of|return|try|catch|class|new|console)\b/g, '<span class="keyword">$1</span>');
  } else if(lang === 'PY'){
    return escapeHtml(text)
      .replace(/(#.*?$)/gm, '<span class="comment">$1</span>')
      .replace(/('[^']*'|\"[^\"]*\")/g, '<span class="string">$1</span>')
      .replace(/\b(def|yield|return|for|in|while|if|else|class|print|import)\b/g, '<span class="keyword">$1</span>');
  } else if(lang === 'CPP'){
    return escapeHtml(text)
      .replace(/(\/\/.*?$)/gm, '<span class="comment">$1</span>')
      .replace(/("[^"]*"|'[^']*')/g, '<span class="string">$1</span>')
      .replace(/\b(int|class|return|using|namespace|include|cout|endl)\b/g, '<span class="keyword">$1</span>');
  }
  return escapeHtml(text);
}

function renderTarget(){
  // build spans per character
  codeView.innerHTML = '';
  chars = [];
  const html = simpleHighlight(target);
  // html contains tags for spans; we need to break into characters while preserving tags visually.
  // Simpler: iterate target string and create span per char with classes
  for(let i=0;i<target.length;i++){
    const ch = target[i];
    const sp = document.createElement('span');
    sp.className = 'char';
    sp.dataset.index = i;
    if(ch === '\n'){
      sp.textContent = '\n';
      sp.classList.add('codeLine');
    } else if(ch === ' '){
      sp.textContent = ' ';
    } else if(ch === '\t'){
      sp.textContent = '\t';
    } else {
      sp.textContent = ch;
    }
    codeView.appendChild(sp);
    chars.push({ch, span: sp, status: 'pending'});
  }
  // place initial cursor
  pos = 0; running = false; updateCursor();
}

function updateCursor(){
  // remove existing cursor
  document.querySelectorAll('.cursor').forEach(e=>e.remove());
  if(pos >= chars.length) return;
  const sp = chars[pos].span;
  const cursor = document.createElement('i');
  cursor.className='cursor';
  sp.after(cursor);
}

function start(){
  if(!target || target.length===0) { alert('지문을 먼저 준비하세요.'); return; }
  // if custom selected, reload from textarea
  if(sampleSelect.value==='custom') loadSample('custom');
  running = true; startTime = Date.now(); mistakes = {}; updateStats();
  hiddenInput.value=''; hiddenInput.focus();
  if(timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(updateStats, 500);
}

function reset(){
  running=false; if(timerInterval) clearInterval(timerInterval); startTime=null; mistakes={};
  renderTarget(); updateStats();
}

function updateStats(){
  const elapsed = startTime ? Math.floor((Date.now()-startTime)/1000) : 0;
  timeEl.textContent = elapsed;
  const typedCount = chars.filter(c=>c.status!=='pending' && c.status!=='pending').length;
  // compute cpm by number of correct+incorrect typed characters
  const totalTyped = chars.reduce((acc,c)=> acc + (c.status!=='pending'?1:0),0);
  const correct = chars.reduce((acc,c)=> acc + (c.status==='ok'?1:0),0);
  const cpm = elapsed>0 ? Math.round((totalTyped/elapsed)*60) : 0;
  const acc = totalTyped>0 ? Math.round((correct/totalTyped)*100) : 100;
  cpmEl.textContent = cpm;
  accEl.textContent = acc + '%';
  // mistakes list
  const list = Object.entries(mistakes).sort((a,b)=>b[1]-a[1]).slice(0,8);
  mistakesEl.innerHTML = list.map(([k,v])=> `<li>${escapeHtml(k)} : ${v}</li>`).join('') || '<li class="small">없음</li>';
}

// handle typing
hiddenInput.addEventListener('keydown', (e)=>{
  if(!running) start();
  // custom handling for Tab
  if(e.key === 'Tab'){
    e.preventDefault();
    const tab = '\t';
    handleChar(tab);
    return;
  }
  if(e.key === 'Backspace'){
    e.preventDefault();
    if(pos>0){
      pos--;
      chars[pos].status = 'pending';
      chars[pos].span.classList.remove('ok','err','correct');
      updateCursor();
    }
    return;
  }
  if(e.key.length === 1){
    // normal printable character
    handleChar(e.key);
    e.preventDefault();
  }
});

function handleChar(inputChar){
  if(pos >= chars.length) return;
  let expected = chars[pos].ch;
  let input = inputChar;
  // compare tabs and spaces
  if(expected === '\t' && input === '\t'){
    chars[pos].status = 'ok';
    chars[pos].span.classList.add('ok');
  } else if(expected === '\n' && input === '\r'){
    // ignore
    return;
  } else if(input === expected){
    chars[pos].status = 'ok';
    chars[pos].span.classList.add('ok');
  } else if(input === ' ' && expected === ' '){
    chars[pos].status = 'ok'; chars[pos].span.classList.add('ok');
  } else {
    chars[pos].status = 'err';
    chars[pos].span.classList.add('err');
    const key = expected + ' ←/' + input;
    mistakes[key] = (mistakes[key]||0)+1;
  }
  pos++;
  updateCursor();
  // if reached end
  if(pos >= chars.length){
    running = false; if(timerInterval) clearInterval(timerInterval);
  }
  updateStats();
}

// UI events
startBtn.addEventListener('click', ()=>{ start(); hiddenInput.focus(); });
resetBtn.addEventListener('click', ()=>{ reset(); hiddenInput.focus(); });
sampleSelect.addEventListener('change', ()=>{ loadSample(sampleSelect.value); });
customText.addEventListener('input', ()=>{ if(sampleSelect.value==='custom') loadSample('custom'); });
fileInput.addEventListener('change', (e)=>{
  const f = e.target.files[0];
  if(!f) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    customText.value = ev.target.result;
    sampleSelect.value = 'custom';
    loadSample('custom');
  };
  reader.readAsText(f,'utf-8');
});
showHighlight.addEventListener('change', ()=>{ renderTarget(); });

// focus behavior: clicking code area focuses hidden input
codeView.addEventListener('click', ()=>{ hiddenInput.focus(); });

// init
loadSample('sample_js');
</script></body>
</html>
