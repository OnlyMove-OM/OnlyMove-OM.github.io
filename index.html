<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>🐍 Python Typing Practice</title>
  <style>
    body {
      font-family: monospace;
      background: #f4f4f4;
      padding: 20px;
    }
    h1 { text-align: center; }
    #practice-box {
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    #target {
      background: #272822;
      color: #f8f8f2;
      padding: 15px;
      border-radius: 5px;
      display: block;
      white-space: pre-wrap;
    }
    #input {
      width: 100%;
      height: 120px;
      margin-top: 10px;
      font-family: monospace;
      font-size: 14px;
      padding: 5px;
      box-sizing: border-box;
    }
    #check {
      margin-top: 10px;
      padding: 8px 12px;
      font-size: 14px;
      cursor: pointer;
    }
    #result {
      margin-top: 20px;
      padding: 10px;
      background: #e0ffe0;
      border-radius: 5px;
      white-space: pre-wrap;
    }
  </style>
  <!-- 코드 하이라이트 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/default.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<body>
  <h1>🐍 Python Typing Practice</h1>

  <div id="practice-box">
    <pre><code id="target" class="language-python"></code></pre>
    <textarea id="input" placeholder="여기에 코드를 입력하세요..."></textarea>
    <button id="check">제출</button>
  </div>

  <div id="result"></div>

  <script>
    // 예제 데이터
    const GRAMMAR_DATA = {
      "templates": [
        { "code": "for i in range({n}):\\n    print(i)", "desc": "{n}번 반복하여 숫자 출력" },
        { "code": "def add(a, b):\\n    return a + b", "desc": "두 수를 더하는 함수" },
        { "code": "if {x} > {y}:\\n    print('크다')\\nelse:\\n    print('작거나 같다')", "desc": "{x}와 {y} 비교 조건문" },
        { "code": "numbers = [x**2 for x in range({n})]", "desc": "제곱수를 담은 리스트 생성" },
        { "code": "try:\\n    result = int('{val}')\\nexcept ValueError:\\n    print('Error!')", "desc": "문자열을 정수로 변환 시도" },
        { "code": "with open('file.txt', 'w') as f:\\n    f.write('Hello')", "desc": "파일에 문자열 쓰기" },
        { "code": "class Person:\\n    def __init__(self, name):\\n        self.name = name", "desc": "클래스 정의 예제" },
        { "code": "print('Hello, {}'.format('{name}'))", "desc": "format()을 이용한 문자열 포매팅" }
      ]
    };

    // 토큰 설명 사전
    const TOKEN_DICT = {
      "for": "반복문 시작 키워드",
      "in": "멤버십/반복 연산자",
      "if": "조건문 시작 키워드",
      "else": "조건이 거짓일 때 실행되는 블록",
      "def": "함수 정의 키워드",
      "class": "클래스 정의 키워드",
      "try": "예외 처리 블록 시작",
      "except": "예외 발생 시 실행 블록",
      "with": "컨텍스트 관리 블록",
      "as": "별칭 지정 키워드",
      "return": "함수 결과 반환 키워드",
      "print": "출력 함수",
      "range": "연속된 정수 시퀀스 생성 함수",
      "int": "정수형 변환 함수",
      "open": "파일 열기 함수",
      "(": "괄호 시작",
      ")": "괄호 끝",
      "[": "리스트 시작",
      "]": "리스트 끝",
      "{": "딕셔너리/집합 시작",
      "}": "딕셔너리/집합 끝",
      ":": "블록 시작 구분자",
      "=": "값 할당 연산자",
      "+": "덧셈 연산자",
      "**": "제곱 연산자",
      "i": "변수 (사용자 정의)",
      "x": "변수 (사용자 정의)",
      "y": "변수 (사용자 정의)",
      "a": "변수 (사용자 정의)",
      "b": "변수 (사용자 정의)",
      "name": "변수 (사용자 정의)",
      "'abc'": "문자열 리터럴",
      "'Hello'": "문자열 리터럴"
    };

    // 코드 토큰화
    function tokenize(code) {
      const tokens = {};
      const words = code.replace(/\n/g, " ")
        .replace(/([\(\)\[\]\{\}\:\=\+\*])/g, " $1 ")
        .split(/\s+/);
      words.forEach(word => {
        if (TOKEN_DICT[word]) {
          tokens[word] = TOKEN_DICT[word];
        }
      });
      return tokens;
    }

    // 랜덤 정수
    function randInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    // 문제 불러오기
    function loadSnippets() {
      const tplObj = GRAMMAR_DATA.templates[Math.floor(Math.random() * GRAMMAR_DATA.templates.length)];
      const snippet = tplObj.code
        .replace("{n}", randInt(2, 10))
        .replace("{x}", randInt(1, 50))
        .replace("{y}", randInt(1, 50))
        .replace("{val}", "abc")
        .replace("{name}", "Alice");
      const desc = tplObj.desc
        .replace("{n}", randInt(2, 10))
        .replace("{x}", randInt(1, 50))
        .replace("{y}", randInt(1, 50));
      return { code: snippet.replace(/\\n/g, "\n"), desc: desc, tokens: tokenize(snippet) };
    }

    let targetCode = "";
    let startTime = 0;
    let currentDesc = "";
    let currentTokens = {};
    let autoNextTimer = null;

    // 새 문제
    function newPractice() {
      const snippet = loadSnippets();
      targetCode = snippet.code;
      currentDesc = snippet.desc;
      currentTokens = snippet.tokens;

      const targetEl = document.getElementById("target");
      targetEl.textContent = targetCode;
      hljs.highlightElement(targetEl);

      document.getElementById("result").innerHTML = "";
      document.getElementById("input").value = "";

      startTime = Date.now();
    }

    // 코드 비교 함수 (공백/줄바꿈 무시)
    function normalizeCode(code) {
      return code.replace(/\s+/g, " ").trim();
    }

    // 제출 버튼
    document.getElementById("check").addEventListener("click", () => {
      const input = document.getElementById("input").value;
      const endTime = Date.now();
      const timeTaken = ((endTime - startTime) / 1000).toFixed(2);

      let resultEl = document.getElementById("result");

      if (normalizeCode(input) === normalizeCode(targetCode)) {
        let tokenDescHtml = Object.entries(currentTokens)
          .map(([tok, desc]) => `- ${tok}: ${desc}`)
          .join("\n");

        resultEl.textContent = 
`✅ 정답!
⏱️ 걸린 시간: ${timeTaken}초

📖 설명: ${currentDesc}

🔑 토큰 해설:
${tokenDescHtml}`;

        // 10초 후 자동 넘어가기
        if (autoNextTimer) clearTimeout(autoNextTimer);
        autoNextTimer = setTimeout(() => {
          newPractice();
        }, 10000);

        // 엔터 누르면 즉시 다음 문제
        document.addEventListener("keydown", function handler(e) {
          if (e.key === "Enter") {
            e.preventDefault();
            clearTimeout(autoNextTimer);
            newPractice();
            document.removeEventListener("keydown", handler);
          }
        });

      } else {
        resultEl.textContent = `❌ 오타 발생! 다시 시도하세요.`;
      }
    });

    // 괄호 자동완성 + 탭 지원
    const inputBox = document.getElementById("input");
    inputBox.addEventListener("keydown", function(e) {
      const start = this.selectionStart;
      const end = this.selectionEnd;

      // 탭 → 4칸
      if (e.key === "Tab") {
        e.preventDefault();
        this.value = this.value.substring(0, start) + "    " + this.value.substring(end);
        this.selectionStart = this.selectionEnd = start + 4;
      }

      // 괄호 자동완성
      let insertChar = "";
      if (e.key === "(") insertChar = ")";
      else if (e.key === "[") insertChar = "]";
      else if (e.key === "{") insertChar = "}";
      else if (e.key === "'") insertChar = "'";
      else if (e.key === '"') insertChar = '"';

      if (insertChar) {
        e.preventDefault();
        const value = this.value;
        this.value = value.slice(0, start) + e.key + insertChar + value.slice(end);
        this.selectionStart = this.selectionEnd = start + 1;
      }
    });

    // 시작
    newPractice();
  </script>
</body>
</html>
